<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Produtos - Sistema de Vendas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="layout">
    <main class="container">
      <div class="page-head">
        <div>
          <h1 class="display">Produtos</h1>
          <p class="hero-sub">Controle estoque e preços com alertas visuais.</p>
        </div>
        <button class="md-fab" onclick="abrirModal()"><span class="material-symbols-outlined" aria-hidden="true">add</span>Novo</button>
      </div>
      <div class="toolbar">
        <label class="search-field">
          <span class="material-symbols-outlined" aria-hidden="true">search</span>
          <input type="search" id="busca" placeholder="Buscar produto…" autocomplete="off">
        </label>
        <span class="contador" id="contador"></span>
      </div>
      <div class="table-wrap">
        <table id="tabelaProdutos">
          <thead><tr><th scope="col">ID</th><th scope="col">Nome</th><th scope="col">Qtd</th><th scope="col">Valor</th><th scope="col" style="text-align:right">Ações</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
      <div id="modal" class="md-dialog-scrim" style="display:none;">
        <div class="md-dialog" role="dialog" aria-modal="true" aria-labelledby="modalTitulo">
          <h2><span id="modalTitulo">Novo Produto</span></h2>
          <form id="formProduto">
            <input type="hidden" id="produtoId">
            <div class="field"><label for="nome">Nome *</label><input type="text" id="nome" name="nome" placeholder="Ex: Camiseta" required></div>
            <div class="field"><label for="qtd">Quantidade *</label><input type="number" id="qtd" name="qtd" min="0" placeholder="0" required inputmode="numeric"></div>
            <div class="field"><label for="valor">Valor *</label><input type="number" id="valor" name="valor" step="0.01" min="0" placeholder="0.00" required inputmode="numeric"></div>
            <div class="dialog-actions">
              <button type="button" class="md-btn md-btn-text" onclick="fecharModal()">Cancelar</button>
              <button type="submit" class="md-btn md-btn-filled"><span class="material-symbols-outlined" aria-hidden="true">check</span>Salvar</button>
            </div>
          </form>
        </div>
      </div>
    </main>
  </div>
  <nav class="nav-floating" aria-label="Navegação principal">
    <a href="index.html"><span class="nav-icon" aria-hidden="true"><span class="material-symbols-outlined">home</span></span><span class="nav-label">Início</span></a>
    <a href="clientes.html"><span class="nav-icon" aria-hidden="true"><span class="material-symbols-outlined">group</span></span><span class="nav-label">Clientes</span></a>
    <a href="produtos.html" class="active" aria-current="page"><span class="nav-icon" aria-hidden="true"><span class="material-symbols-outlined">inventory_2</span></span><span class="nav-label">Produtos</span></a>
    <a href="vendas.html"><span class="nav-icon" aria-hidden="true"><span class="material-symbols-outlined">point_of_sale</span></span><span class="nav-label">Vendas</span></a>
  </nav>
  <div id="snackbar" role="status"></div>
  <script>
    'use strict';
    const API = '/api/produtos';
    const tbody = document.querySelector('#tabelaProdutos tbody');
    const modal = document.getElementById('modal');
    const form = document.getElementById('formProduto');
    const snack = document.getElementById('snackbar');
    const modalTitulo = document.getElementById('modalTitulo');
    const busca = document.getElementById('busca');
    const contador = document.getElementById('contador');
    let todos = [];
    let snackTimer;
    function fmtValor(v) { return 'R$ ' + Number(v).toFixed(2).replace('.', ','); }
    function escapeHtml(t) { const d = document.createElement('div'); d.textContent = t; return d.innerHTML; }
    function escapeJs(t) { return String(t || '').replace(/'/g, "\\'").replace(/"/g, '\\"'); }
    function badgeEstoque(qtd) {
      if (qtd === 0) return ' <span class="badge badge-danger">Esgotado</span>';
      if (qtd <= 5) return ' <span class="badge badge-warn">Baixo</span>';
      return '';
    }
    function mostrarMsg(texto, erro = false) {
      snack.innerHTML = `<span class="material-symbols-outlined">${erro ? 'error' : 'check_circle'}</span>${texto}`;
      snack.className = erro ? 'error' : ''; snack.classList.add('show');
      clearTimeout(snackTimer); snackTimer = setTimeout(() => snack.classList.remove('show'), 3500);
    }
    function mostrarSkeleton() {
      tbody.innerHTML = '';
      for (let i = 0; i < 3; i++) {
        const tr = document.createElement('tr');
        tr.innerHTML = '<td data-label="ID"><span class="skeleton">00</span></td><td data-label="Nome"><span class="skeleton">Carregando produto</span></td><td data-label="Qtd"><span class="skeleton">00</span></td><td data-label="Valor"><span class="skeleton">R$ 0,00</span></td><td data-label="Ações" class="actions"><span class="skeleton">•••</span></td>';
        tbody.appendChild(tr);
      }
    }
    function render() {
      const q = busca.value.trim().toLowerCase();
      const lista = !q ? todos : todos.filter(p => String(p.nome || '').toLowerCase().includes(q));
      tbody.innerHTML = '';
      contador.textContent = todos.length ? `${lista.length} de ${todos.length}` : '';
      if (!todos.length) { tbody.innerHTML = '<tr class="empty-state"><td colspan="5"><span class="material-symbols-outlined big-icon">inventory</span>Nenhum produto cadastrado</td></tr>'; return; }
      if (!lista.length) { tbody.innerHTML = '<tr class="empty-state"><td colspan="5"><span class="material-symbols-outlined big-icon">search_off</span>Nenhum resultado para a busca</td></tr>'; return; }
      lista.forEach(p => {
        const tr = document.createElement('tr');
        tr.innerHTML = `<td data-label="ID">${p.id}</td><td data-label="Nome">${escapeHtml(p.nome)}${badgeEstoque(Number(p.qtd))}</td><td data-label="Qtd">${p.qtd}</td><td data-label="Valor"><span class="chip-valor">${fmtValor(p.valor)}</span></td>
        <td data-label="Ações" class="actions"><button class="md-icon-btn" title="Editar" aria-label="Editar ${escapeHtml(p.nome)}" onclick="editarProduto(${p.id}, '${escapeJs(p.nome)}', ${p.qtd}, ${p.valor})"><span class="material-symbols-outlined">edit</span></button><button class="md-icon-btn danger" title="Excluir" aria-label="Excluir ${escapeHtml(p.nome)}" onclick="excluirProduto(${p.id})"><span class="material-symbols-outlined">delete</span></button></td>`;
        tbody.appendChild(tr);
      });
    }
    async function carregarProdutos() {
      mostrarSkeleton();
      try {
        const res = await fetch(API); const produtos = await res.json();
        if (!res.ok) throw new Error(produtos.erro || 'Falha ao carregar');
        todos = Array.isArray(produtos) ? produtos : [];
        render();
      } catch (err) { tbody.innerHTML = ''; mostrarMsg('Erro ao carregar: ' + err.message, true); }
    }
    function abrirModal(p = null) {
      form.reset(); document.getElementById('produtoId').value = '';
      if (p) { modalTitulo.textContent = 'Editar Produto'; document.getElementById('produtoId').value = p.id; document.getElementById('nome').value = p.nome; document.getElementById('qtd').value = p.qtd; document.getElementById('valor').value = p.valor; }
      else modalTitulo.textContent = 'Novo Produto';
      modal.style.display = 'flex';
      setTimeout(function () { var primeiro = modal.querySelector('input:not([type="hidden"])'); if (primeiro) primeiro.focus(); }, 50);
    }
    function fecharModal() { modal.style.display = 'none'; }
    function editarProduto(id, nome, qtd, valor) { abrirModal({ id, nome, qtd, valor }); }
    async function excluirProduto(id) {
      if (!confirm('Excluir este produto?')) return;
      try { const res = await fetch(`${API}/${id}`, { method: 'DELETE' }); const d = await res.json(); if (!res.ok) throw new Error(d.erro); mostrarMsg('Produto excluído!'); carregarProdutos(); }
      catch (err) { mostrarMsg('Erro: ' + err.message, true); }
    }
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const id = document.getElementById('produtoId').value;
      const dados = { nome: document.getElementById('nome').value, qtd: parseInt(document.getElementById('qtd').value), valor: parseFloat(document.getElementById('valor').value) };
      try {
        const res = await fetch(id ? `${API}/${id}` : API, { method: id ? 'PUT' : 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(dados) });
        const d = await res.json(); if (!res.ok) throw new Error(d.erro);
        mostrarMsg(id ? 'Produto atualizado!' : 'Produto criado!'); fecharModal(); carregarProdutos();
      } catch (err) { mostrarMsg('Erro: ' + err.message, true); }
    });
    busca.addEventListener('input', render);
    modal.addEventListener('click', (e) => { if (e.target === modal) fecharModal(); });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && modal.style.display === 'flex') fecharModal(); });
    carregarProdutos();
  </script>
</body>
</html>
