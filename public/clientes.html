<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clientes - Sistema de Vendas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="layout">
    <main class="container">
      <div class="page-head">
        <h2 class="display">Clientes</h2>
        <button class="md-fab" onclick="abrirModal()"><span class="material-symbols-outlined" aria-hidden="true">add</span>Novo</button>
      </div>
      <div class="table-wrap">
        <table id="tabelaClientes">
          <thead><tr><th scope="col">ID</th><th scope="col">Nome</th><th scope="col">Email</th><th scope="col">Telefone</th><th scope="col" style="text-align:right">Ações</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
      <div id="modal" class="md-dialog-scrim" style="display:none;">
        <div class="md-dialog" role="dialog" aria-modal="true" aria-labelledby="modalTitulo">
          <h2><span id="modalTitulo">Novo Cliente</span></h2>
          <form id="formCliente">
            <input type="hidden" id="clienteId">
            <div class="field"><label for="nome">Nome *</label><input type="text" id="nome" name="nome" placeholder="Ex: Maria Silva" required autocomplete="name"></div>
            <div class="field"><label for="email">Email</label><input type="email" id="email" name="email" placeholder="Ex: maria@email.com" autocomplete="email"></div>
            <div class="field"><label for="telefone">Telefone</label><input type="text" id="telefone" name="telefone" placeholder="Ex: (11) 99999-0000" inputmode="numeric" autocomplete="tel"></div>
            <div class="dialog-actions">
              <button type="button" class="md-btn md-btn-text" onclick="fecharModal()">Cancelar</button>
              <button type="submit" class="md-btn md-btn-filled"><span class="material-symbols-outlined" aria-hidden="true">check</span>Salvar</button>
            </div>
          </form>
        </div>
      </div>
    </main>
  </div>
  <nav class="nav-floating" aria-label="Navegação principal">
    <a href="index.html"><span class="nav-icon" aria-hidden="true"><span class="material-symbols-outlined">home</span></span><span class="nav-label">Início</span></a>
    <a href="clientes.html" class="active" aria-current="page"><span class="nav-icon" aria-hidden="true"><span class="material-symbols-outlined">group</span></span><span class="nav-label">Clientes</span></a>
    <a href="produtos.html"><span class="nav-icon" aria-hidden="true"><span class="material-symbols-outlined">inventory_2</span></span><span class="nav-label">Produtos</span></a>
    <a href="vendas.html"><span class="nav-icon" aria-hidden="true"><span class="material-symbols-outlined">point_of_sale</span></span><span class="nav-label">Vendas</span></a>
  </nav>
  <div id="snackbar" role="status"></div>
  <script>
    'use strict';
    const API = '/api/clientes';
    const tbody = document.querySelector('#tabelaClientes tbody');
    const modal = document.getElementById('modal');
    const form = document.getElementById('formCliente');
    const snack = document.getElementById('snackbar');
    const modalTitulo = document.getElementById('modalTitulo');
    let snackTimer;
    function mostrarMsg(texto, erro = false) {
      snack.innerHTML = `<span class="material-symbols-outlined">${erro ? 'error' : 'check_circle'}</span>${texto}`;
      snack.className = erro ? 'error' : ''; snack.classList.add('show');
      clearTimeout(snackTimer); snackTimer = setTimeout(() => snack.classList.remove('show'), 3500);
    }
    function escapeHtml(t) { const d = document.createElement('div'); d.textContent = t; return d.innerHTML; }
    function escapeJs(t) { return t.replace(/'/g, "\\'").replace(/"/g, '\\"'); }
    async function carregarClientes() {
      try {
        const res = await fetch(API); const clientes = await res.json(); tbody.innerHTML = '';
        if (!clientes.length) { tbody.innerHTML = '<tr class="empty-state"><td colspan="5"><span class="material-symbols-outlined big-icon">group_off</span>Nenhum cliente cadastrado</td></tr>'; return; }
        clientes.forEach(c => {
          const tr = document.createElement('tr');
          tr.innerHTML = `<td>${c.id}</td><td>${escapeHtml(c.nome)}</td><td>${escapeHtml(c.email || '–')}</td><td>${escapeHtml(c.telefone || '–')}</td>
          <td class="actions"><button class="md-icon-btn" title="Editar" onclick="editarCliente(${c.id}, '${escapeJs(c.nome)}', '${escapeJs(c.email || '')}', '${escapeJs(c.telefone || '')}')"><span class="material-symbols-outlined">edit</span></button><button class="md-icon-btn danger" title="Excluir" onclick="excluirCliente(${c.id})"><span class="material-symbols-outlined">delete</span></button></td>`;
          tbody.appendChild(tr);
        });
      } catch (err) { mostrarMsg('Erro ao carregar: ' + err.message, true); }
    }
    function abrirModal(c = null) {
      form.reset(); document.getElementById('clienteId').value = '';
      if (c) { modalTitulo.textContent = 'Editar Cliente'; document.getElementById('clienteId').value = c.id; document.getElementById('nome').value = c.nome; document.getElementById('email').value = c.email || ''; document.getElementById('telefone').value = c.telefone || ''; }
      else modalTitulo.textContent = 'Novo Cliente';
      modal.style.display = 'flex';
      setTimeout(function () { var primeiro = modal.querySelector('input:not([type="hidden"])'); if (primeiro) primeiro.focus(); }, 50);
    }
    function fecharModal() { modal.style.display = 'none'; }
    function editarCliente(id, nome, email, telefone) { abrirModal({ id, nome, email, telefone }); }
    async function excluirCliente(id) {
      if (!confirm('Excluir este cliente?')) return;
      try { const res = await fetch(`${API}/${id}`, { method: 'DELETE' }); const d = await res.json(); if (!res.ok) throw new Error(d.erro); mostrarMsg('Cliente excluído!'); carregarClientes(); }
      catch (err) { mostrarMsg('Erro: ' + err.message, true); }
    }
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const id = document.getElementById('clienteId').value;
      const dados = { nome: document.getElementById('nome').value, email: document.getElementById('email').value, telefone: document.getElementById('telefone').value };
      try {
        const res = await fetch(id ? `${API}/${id}` : API, { method: id ? 'PUT' : 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(dados) });
        const d = await res.json(); if (!res.ok) throw new Error(d.erro);
        mostrarMsg(id ? 'Cliente atualizado!' : 'Cliente criado!'); fecharModal(); carregarClientes();
      } catch (err) { mostrarMsg('Erro: ' + err.message, true); }
    });
    modal.addEventListener('click', (e) => { if (e.target === modal) fecharModal(); });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && modal.style.display === 'flex') fecharModal(); });
    carregarClientes();
  </script>
</body>
</html>
